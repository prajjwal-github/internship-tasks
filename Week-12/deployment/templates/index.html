<!DOCTYPE html>
<html>
<head>
    <title>Churn Predictor</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f4f4f4;
            padding: 40px;
        }
        input, select {
            margin: 5px;
            padding: 8px;
            width: 200px;
        }
        button {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            margin-top: 10px;
        }
        h2 {
            color: #333;
        }
    </style>
</head>

<body>

<h2>📊 Customer Churn Predictor</h2>

<form action="/predict" method="post">

    <input type="number" name="tenure" placeholder="Tenure (months)" required><br>
    <input type="number" step="0.1" name="MonthlyCharges" placeholder="Monthly Charges" required><br>
    <input type="number" step="0.1" name="TotalCharges" placeholder="Total Charges" required><br>

    <select name="gender">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select><br>

    <select name="SeniorCitizen">
        <option value="0">No</option>
        <option value="1">Yes</option>
    </select><br>

    <select name="Partner">
        <option value="Yes">Yes</option>
        <option value="No">No</option>
    </select><br>

    <select name="Dependents">
        <option value="Yes">Yes</option>
        <option value="No">No</option>
    </select><br>

    <select name="PhoneService">
        <option value="Yes">Yes</option>
        <option value="No">No</option>
    </select><br>

    <select name="InternetService">
        <option value="DSL">DSL</option>
        <option value="Fiber optic">Fiber optic</option>
        <option value="No">No</option>
    </select><br>

    <select name="Contract">
        <option value="Month-to-month">Month-to-month</option>
        <option value="One year">One year</option>
        <option value="Two year">Two year</option>
    </select><br>

    <button type="submit">Predict</button>

</form>

<h3>{{ prediction_text }}</h3>

</body>
</html>
